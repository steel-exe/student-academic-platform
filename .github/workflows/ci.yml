name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Lint, Test & Coverage
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Code Linting & Syntax Gate
      run: |
        flake8 app/ database/ --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Execute Automated Pytest Suites
      run: |
        mkdir -p reports
        pytest -v --cov=app --cov-report=term-missing --junitxml=reports/test-results.xml tests/

    - name: Upload Test Results Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: reports/

  docker:
    name: Build Docker Container
    needs: test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Build Docker Container Image
      run: |
        docker build -t student-academic-platform:latest -t student-academic-platform:${{ github.sha }} .
        docker images
